<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Caronas</title>
<meta name="description" content="Ofereça ou encontre carona.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1c2422;
    --muted: #66706c;
    --line: #e4e0d8;
    --accent: #1f6b57;
    --accent-ink: #ffffff;
    --accent-soft: #e2efe9;
    --ida: #1f6b57;
    --ida-soft: #e2efe9;
    --volta: #a3561c;
    --volta-soft: #f7e8da;
    --danger: #b3261e;
    --danger-soft: #fbe9e7;
    --wa: #128c4a;
    --shadow: 0 1px 2px rgba(28,36,34,.06), 0 4px 14px rgba(28,36,34,.05);
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121615; --card: #1b2120; --ink: #e8ece9; --muted: #9aa49f; --line: #2c3432;
      --accent: #5cc3a2; --accent-ink: #0d1f19; --accent-soft: #1f3a31;
      --ida: #5cc3a2; --ida-soft: #1f3a31; --volta: #e8a066; --volta-soft: #3d2a1a;
      --danger: #f2877e; --danger-soft: #3d1f1c; --wa: #4cd087;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 110px; }

  /* topo */
  header { padding: 22px 0 14px; display: flex; gap: 12px; align-items: flex-start; }
  header .t { flex: 1; min-width: 0; }
  header h1 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .eu { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }

  /* abas */
  nav.abas { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; position: sticky; top: 8px; z-index: 5; box-shadow: var(--shadow); }
  nav.abas button { flex: 1 1 auto; white-space: nowrap; border: 0; background: none; padding: 9px 6px; border-radius: 9px;
    font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  nav.abas button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  nav.abas .n { font-weight: 500; opacity: .8; }
  @media (max-width: 380px) { nav.abas button { font-size: 13px; padding: 9px 4px; } }

  .filtros { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 99px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .filtros select { border: 1px solid var(--line); background: var(--card); padding: 6px 10px;
    border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }

  h2.grupo { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 22px 2px 8px; display: flex; gap: 8px; align-items: center; }
  h2.grupo::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  h3.sec { font-size: 16px; margin: 26px 2px 10px; }

  /* cartões */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .card.minha { border-color: var(--accent); }
  .topo { display: flex; gap: 10px; align-items: center; }
  .topo .quem { flex: 1; min-width: 0; }
  .topo .quem strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topo .quem span { color: var(--muted); font-size: 13px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .tag.Ida { background: var(--ida-soft); color: var(--ida); }
  .tag.Volta { background: var(--volta-soft); color: var(--volta); }
  .rota { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .rota .h { font-weight: 700; font-variant-numeric: tabular-nums; }
  .rota .l { color: var(--ink); }
  .rota .l small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .trajeto { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; font-size: 18px; font-weight: 800; line-height: 1.25;
    padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .trajeto small { font-size: 12px; font-weight: 700; color: var(--muted); }
  .trajeto b { color: var(--accent); }
  .faixa { display: grid; grid-template-columns: auto 1fr auto 1fr; align-items: center; gap: 8px; }
  .faixa small { color: var(--muted); font-size: 14px; }
  .topo-dir { display: flex; align-items: center; gap: 10px; }
  .sino { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    font-size: 19px; line-height: 1; cursor: pointer; padding: 0; }
  .sino .badge { position: absolute; top: -5px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px;
    background: var(--danger); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .sino.tem { animation: balanca 1.1s ease-in-out 3; }
  @keyframes balanca { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-16deg); } 40% { transform: rotate(14deg); }
    60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); } }
  .faixa-avisos { display: block; width: 100%; margin: 0 0 12px; padding: 12px 14px; border: 0; border-left: 4px solid var(--volta);
    border-radius: 12px; background: var(--volta-soft); color: var(--ink); font-weight: 700; font-size: 14px; text-align: left; cursor: pointer; }
  .aviso-item { padding: 12px; border-radius: 12px; background: var(--bg); margin-bottom: 8px; font-size: 14px; }
  .aviso-item.novo { background: var(--volta-soft); border-left: 4px solid var(--volta); }
  .aviso-item time { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .aviso-item .acoes { margin-top: 8px; }
  .pergunta-pedido { margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
  .pergunta-pedido .acoes { margin-top: 8px; }
  .card.destaque { outline: 3px solid var(--volta); outline-offset: 2px; }
  .opcao-check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .opcao-check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .opcao-check small { display: block; color: var(--muted); font-weight: 400; }
  .link-perfil { cursor: pointer; }
  .nova-versao { display: block; margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font-weight: 700; text-decoration: none; text-align: center; }
  .pass .link-perfil { display: inline-flex; align-items: center; gap: 6px; }
  .pendentes { margin-top: 12px; padding: 10px; border-radius: 12px; background: var(--volta-soft); }
  .pendentes > b { display: block; font-size: 13px; margin-bottom: 4px; }
  .pendentes > small { display: block; color: var(--muted); margin-top: 6px; }
  .pend { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .pend .link-perfil { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .pend .btn { padding: 7px 10px; font-size: 13px; }
  .aguardando { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--volta-soft); font-size: 13px; }
  nav.abas .n.alerta { display: inline-block; min-width: 20px; line-height: 20px; text-align: center; font-size: 12px;
    font-weight: 700; background: var(--danger); color: #fff; border-radius: 99px; padding: 0 6px; opacity: 1; }
  .ver-perfil { text-align: center; }
  .ver-perfil .av { margin: 0 auto 10px; }
  .ver-perfil img.av { display: block; }
  .ver-perfil h3 { margin: 0 0 4px; font-size: 20px; }
  .ver-perfil .tel { margin: 0 0 12px; color: var(--muted); }
  .ver-perfil .desc { text-align: left; white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 12px; margin: 0 0 14px; }
  .ver-perfil .desc.vazio { color: var(--muted); }
  .ver-perfil .acoes { justify-content: center; }
  .pergunta { margin-top: 0; font-size: 15px; }
  .rota .seta { color: var(--muted); font-size: 12px; }
  .assentos { display: flex; align-items: center; gap: 5px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .assentos i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
  .assentos i.ocup { background: var(--accent); }
  .assentos b { margin-left: 4px; color: var(--ink); }
  .assentos b.lotado { color: var(--danger); }
  .passageiros { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pass { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 99px;
    padding: 3px 10px 3px 3px; font-size: 13px; }
  .pass button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; font-size: 15px; line-height: 1; }
  .obs { margin: 10px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .acoes { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .av { width: 36px; height: 36px; border-radius: 50%; flex: none; object-fit: cover; display: grid;
    place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
  .av.p { width: 24px; height: 24px; font-size: 10px; }
  .av.g { width: 84px; height: 84px; font-size: 28px; }

  /* botões */
  .btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 10px;
    font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.wa { color: var(--wa); }
  .btn.perigo { color: var(--danger); }
  .btn.cheio { width: 100%; justify-content: center; padding: 12px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 16px; height: 16px; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 6; }
  .barra .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .barra .btn { flex: 1; justify-content: center; padding: 13px; box-shadow: var(--shadow); }

  .vazio { text-align: center; color: var(--muted); padding: 34px 16px; border: 1px dashed var(--line);
    border-radius: var(--r); margin-top: 16px; }
  .vazio strong { display: block; color: var(--ink); margin-bottom: 4px; }

  /* formulários */
  .f { display: block; margin-bottom: 14px; }
  .f > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .f > span small { color: var(--muted); font-weight: 400; }
  .in-txt { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); font-size: 16px; }
  .in-txt:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea.in-txt { min-height: 70px; resize: vertical; }
  .lado { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dias { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .dias input { position: absolute; opacity: 0; pointer-events: none; }
  .dias span { display: block; text-align: center; padding: 7px 2px; border: 1px solid var(--line); border-radius: 10px;
    font-weight: 700; font-size: 13px; line-height: 1.25; cursor: pointer; background: var(--bg); }
  .dias small { display: block; font-weight: 500; color: var(--muted); }
  .dias input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .dias input:checked + span small { color: var(--accent); }
  .cal, .cid { position: relative; }
  .cal-abre { display: block; margin: 0; text-align: left; cursor: pointer; }
  .cal-abre.vazio { color: var(--muted); }
  .cal-janela, .cid-lista { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
  .cal-janela { padding: 10px; }
  .cid-lista { overflow: hidden; }
  .cid-lista button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
    background: none; padding: 11px 12px; font-size: 15px; cursor: pointer; color: var(--ink); }
  .cid-lista button:last-child { border-bottom: 0; }
  .cid-msg { margin: 0; padding: 11px 12px; color: var(--muted); font-size: 14px; }
  .cal-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-topo strong { font-size: 15px; }
  .cal-topo button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 40px; height: 36px;
    font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
  .cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-sem { font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 0; }
  .cal-dia { border: 0; background: none; height: 38px; border-radius: 10px; font-size: 15px; cursor: pointer; color: var(--ink); }
  .cal-dia.hoje { box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-dia.sel { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .cal-dia:disabled { color: var(--line); cursor: default; }
  .foto-sel { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

  /* formulários abrem como tela normal, sem camada flutuante: no iPhone e no navegador do WhatsApp,
     campos dentro de algo "position: fixed" na moldura do Google não recebem o toque */
  .modal { padding: 16px 12px 40px; }
  .modal[hidden] { display: none; }
  .modal .caixa { max-width: 520px; margin: 0 auto; border-radius: 18px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .modal form { padding: 20px; }
  .modal h2 { margin: 0 0 16px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal .x { border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer; padding: 7px 12px; border-radius: 10px; white-space: nowrap; }
  body.com-janela #app { display: none; }
  .opcao { display: block; width: 100%; text-align: left; margin-bottom: 8px; }

  /* entrada */
  .entrada { max-width: 420px; margin: 8vh auto 0; }
  .entrada .card { padding: 24px; }
  .entrada h1 { font-size: 26px; margin: 0 0 6px; }
  .entrada p.sub { margin: 0 0 22px; color: var(--muted); }
  .alerta { font-size: 13px; background: var(--volta-soft); color: var(--ink); border-left: 3px solid var(--volta);
    padding: 9px 11px; border-radius: 8px; margin: -2px 0 16px; }
  .btn.link { border: 0; background: none; color: var(--accent); margin-top: 6px; }
  .dica { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
  .in-txt.codigo { font-size: 24px; letter-spacing: 8px; text-align: center; font-variant-numeric: tabular-nums; }
  .aviso { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    transition: .2s; z-index: 20; max-width: calc(100% - 32px); pointer-events: none; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.erro { background: var(--danger); color: #fff; }

  .carregando { text-align: center; padding: 30vh 0; color: var(--muted); }
  .gira { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: g 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><div class="carregando"><div class="gira"></div>Carregando…</div></div>
<div id="modal" class="modal" hidden><div class="caixa"><form id="mform"></form></div></div>
<div id="toast" role="status"></div>

<script>
/* site do GitHub: conversa com a planilha pela porta de entrada (doPost) do Apps Script */
(function () {
  var API = 'https:' + String.fromCharCode(47, 47) + 'script.google.com/macros/s/AKfycbzrxKgdER1msk8NHDKFMjoHxdrgQQLm17O4oiaGZlXklRU7h3YmeA8PW_T48BBo1N7I/exec';
  function runner(h) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return runner(Object.assign({}, h, { ok: f })); };
      if (fn === 'withFailureHandler') return function (f) { return runner(Object.assign({}, h, { falha: f })); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
          .then(function (r) { if (!r.ok) throw new Error('Falha de conexão.'); return r.json(); })
          .then(function (x) {
            /* o aviso de versão nova recarrega este site, não o link do Google */
            var e = x && (x.estado || x);
            if (e && e.app) e.app.url = location.href.split('#')[0];
            if (h.ok) h.ok(x);
          })
          .catch(function () { if (h.falha) h.falha(new Error('Falha de conexão. Confira a internet e tente de novo.')); });
      };
    } });
  }
  window.google = { script: { run: runner({}) } };
})();
</script>
<script>
/* mostra na tela qualquer erro, em vez de ficar carregando para sempre */
(function () {
  function mostrar(msg) {
    var el = document.getElementById('app');
    if (!el || el.getAttribute('data-ok')) return;
    el.innerHTML = '<div class="carregando" style="padding:20vh 16px">Ops, o app não carregou.<br><small style="display:block;margin-top:10px;word-break:break-word">' +
      String(msg).replace(/[<>&]/g, '') + '</small><br><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
  }
  window.addEventListener('error', function (e) { mostrar((e.message || 'erro') + (e.lineno ? ' (linha ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { mostrar(e.reason && e.reason.message || e.reason); });
  setTimeout(function () { mostrar('O servidor demorou demais para responder.'); }, 30000);
})();
</script>
<script>

  mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  mao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-.5V6.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.6a7 7 0 0 1-5.6-2.8L3.4 16a1.6 1.6 0 0 1 2.5-2L9 16.5V8.5a1.5 1.5 0 0 1 3 0"/></svg>'
};

/* ======================================================== servidor */
function chamar(fn, ...args) {
  return new Promise((ok, falha) => {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e => falha(new Error((e && e.message) || 'Falha de conexão.')))[fn](...args);
  });
}

async function acao(nome, dados, msgOk, botao) {
  if (S.ocupado) return false;
  S.ocupado = true;
  if (botao) botao.disabled = true;
  try {
    const r = await chamar('api', nome, dados);
    if (!r.ok) {
      toast(r.erro, true);
      if (/sessão expirou/.test(r.erro)) atualizar();
      return false;
    }
    S.d = r.estado;
    checaVersao();
    checaAvisos();
    if (msgOk) toast(msgOk);
    if (!(S.naEntrada && S.d.semSessao)) render();
    return r.resultado === undefined ? true : r.resultado;
  } catch (e) {
    toast(e.message, true); return false;
  } finally {
    S.ocupado = false;
    if (botao) botao.disabled = false;
  }
}

/* a página fica aberta por dias: se o servidor mudou de versão, oferece recarregar o app inteiro */
function checaVersao() {
  const v = S.d && S.d.app;
  if (!v) return;
  if (!S.versao) S.versao = v.versao;
  else if (v.versao !== S.versao) S.novaVersao = v.url;
}

/* avisos: chama atenção quando chega aviso novo (mensagem na tela, vibração e número no título da aba) */
const naoLidos = () => ((S.d && S.d.avisos) || []).filter(a => !a.lida).length;
function checaAvisos() {
  if (!S.d || !S.d.avisos) return;
  const n = naoLidos();
  if (S.vistos !== undefined && n > S.vistos) {
    const novo = S.d.avisos.find(a => !a.lida);
    if (novo) toast('🔔 ' + novo.texto);
    try { if (navigator.vibrate) navigator.vibrate([150, 80, 150]); } catch (e) {}
  }
  S.vistos = n;
  const titulo = (S.d.config && S.d.config.titulo) || 'Caronas';
  document.title = (n ? '(' + n + ') ' : '') + titulo;
}

async function atualizar() {
  try { S.d = await chamar('estado', S.token); checaVersao(); checaAvisos(); $('#app').setAttribute('data-ok', '1'); render(); }
  catch (e) {
    if (!S.d) {
      $('#app').setAttribute('data-ok', '1');
      $('#app').innerHTML = '<div class="carregando" style="padding:20vh 16px">Não foi possível carregar.<br><small>' + esc(e.message) + '</small></div>';
    }
  }
}

/* ===================================================== utilidades */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pessoa = id => (S.d.pessoas.find(p => p.id === id) || { id, nome: 'Alguém', telefone: '', foto: '' });
const primeiro = n => String(n || '').split(' ')[0];

function cor(id) {
  let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 42% 42%)`;
}
/* fotos: a atualização traz só a etiqueta (fotoV); cada foto é baixada uma vez, em lote, e fica guardada no aparelho */
const CHAVE_FOTOS = 'caronas_fotos';
const FOTOS = (() => { try { return JSON.parse(localStorage.getItem(CHAVE_FOTOS) || '{}') || {}; } catch (e) { return {}; } })();
const fotosFaltando = new Set(), fotosNoCaminho = new Set();
const versaoFoto = f => (f ? f.length + '-' + f.slice(-12).replace(/[^A-Za-z0-9]/g, '') : '');
function fotoDe(p) {
  if (p.foto && String(p.foto).indexOf('data:image') === 0) return p.foto;
  if (!p.fotoV) return '';
  const f = FOTOS[p.id];
  if (f && f.v === p.fotoV) return f.url;
  if (!fotosNoCaminho.has(p.id)) {
    fotosFaltando.add(p.id);
    if (!fotoDe.t) fotoDe.t = setTimeout(buscaFotos, 30);
  }
  return '';
}
async function buscaFotos() {
  fotoDe.t = null;
  if (!S.token || !S.d || !S.d.pessoas) return;
  const ids = [...fotosFaltando].filter(id => { const f = FOTOS[id]; return !(f && f.v === pessoa(id).fotoV); }).slice(0, 60);
  fotosFaltando.clear();
  if (!ids.length) return;
  ids.forEach(id => fotosNoCaminho.add(id));
  try {
    const r = await chamar('fotos', S.token, ids);
    Object.keys(r || {}).forEach(id => { FOTOS[id] = r[id]; trocaFoto(id); });
    guardaFotos();
  } catch (e) { /* sem internet: tenta de novo na próxima atualização */ }
  ids.forEach(id => fotosNoCaminho.delete(id));
}
/* põe a foto no lugar das iniciais sem redesenhar a tela (funciona também com um formulário aberto) */
function trocaFoto(id) {
  document.querySelectorAll(`[data-foto="${id}"]`).forEach(el => {
    el.outerHTML = `<img class="${el.className}" src="${esc(FOTOS[id].url)}" alt="">`;
  });
}
function guardaFotos() {
  const ids = new Set(((S.d && S.d.pessoas) || []).map(p => p.id));
  Object.keys(FOTOS).forEach(id => { if (ids.size && !ids.has(id)) delete FOTOS[id]; });
  try { localStorage.setItem(CHAVE_FOTOS, JSON.stringify(FOTOS)); }
  catch (e) { try { localStorage.removeItem(CHAVE_FOTOS); } catch (e2) {} }
}
/* a foto que eu mesmo enviei já fica guardada, sem baixar de volta */
function guardaMinhaFoto(url) {
  if (!S.eu || !url) return;
  FOTOS[S.eu.id] = { v: versaoFoto(url), url: url };
  guardaFotos();
  trocaFoto(S.eu.id);
}

function avatar(p, tam) {
  const cls = 'av' + (tam ? ' ' + tam : '');
  const url = fotoDe(p);
  if (url) return `<img class="${cls}" src="${esc(url)}" alt="">`;
  const ini = String(p.nome || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  const espera = p.fotoV ? ` data-foto="${esc(p.id)}"` : '';
  return `<span class="${cls}" style="background:${cor(p.id)}"${espera} aria-hidden="true">${esc(ini)}</span>`;
}
function dia(iso, longo) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-').map(Number);
  const dt = new Date(a, m - 1, d);
  const s = dt.toLocaleDateString('pt-BR', longo ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: '2-digit', month: '2-digit' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function wa(p, texto) {
  let t = String(p.telefone || '').replace(/\D/g, '');
  if (!t) return '';
  if (t.length <= 11) t = '55' + t;
  return 'https:' + String.fromCharCode(47, 47) + 'wa.me/' + t + '?text=' + encodeURIComponent(texto);
}
/* Google Maps por link: grátis, sem chave. Abre o app do Maps no celular */
function mapa(caminho) { return 'https:' + String.fromCharCode(47, 47) + 'www.google.com/maps/' + caminho; }
const endereco = (local, cidade) => [local, cidade].filter(Boolean).join(', ');
function btnRota(de, para) {
  const u = mapa('dir/?api=1&origin=' + encodeURIComponent(de) + '&destination=' + encodeURIComponent(para));
  return `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">📍 Como chegar</a>`;
}
function btnMapa(onde) {
  const u = mapa('search/?api=1&query=' + encodeURIComponent(onde));
  return `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">📍 Ver no mapa</a>`;
}
function btnWa(p, texto) {
  const u = wa(p, texto);
  return u ? `<a class="btn wa" href="${u}" target="_blank" rel="noopener">${ICON.wa} WhatsApp</a>` : '';
}
function toast(msg, erro) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'on' + (erro ? ' erro' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', erro ? 4500 : 2500);
}
function lerToken() { try { return localStorage.getItem(CHAVE); } catch (e) { return null; } }
function salvarToken(t) { S.token = t || null; try { t ? localStorage.setItem(CHAVE, t) : localStorage.removeItem(CHAVE); } catch (e) {} }

/* reservasDe = passageiros aprovados (ocupam vaga); pendentesDe = pedidos de vaga esperando o motorista */
const reservasDe = cid => S.d.reservas.filter(r => r.caronaId === cid && r.status !== 'pendente');
const pendentesDe = cid => S.d.reservas.filter(r => r.caronaId === cid && r.status === 'pendente');
const meusPendentes = () => S.d.caronas.filter(c => c.motoristaId === S.eu.id).reduce((n, c) => n + pendentesDe(c.id).length, 0);
/* nome e foto clicáveis abrem o perfil público da pessoa */
const quemLink = (p, tam) => `<span class="link-perfil" data-perfil="${esc(p.id)}">${avatar(p, tam)}</span>`;
/* trajeto = cidade de saída > cidade de destino (registros antigos sem cidade usam Ida/Volta) */
const trajeto = x => { const de = x.cidadeSaida || x.cidade || ''; return de && x.cidadeDestino ? de + ' > ' + x.cidadeDestino : (x.sentido || ''); };
const mesmaViagem = (a, b) => a.data === b.data && trajeto(a) === trajeto(b);
const nomeCid = c => { c = String(c || ''); const i = c.lastIndexOf(' ('); return i > 0 ? [c.slice(0, i), c.slice(i + 2, -1)] : [c, '']; };
const trajetoTxt = x => {
  const de = x.cidadeSaida || x.cidade;
  if (de && x.cidadeDestino) return 'de ' + nomeCid(de)[0] + ' para ' + nomeCid(x.cidadeDestino)[0];
  return x.sentido ? 'de ' + x.sentido.toLowerCase() : '';
};
function trajetoHtml(x) {
  const de = x.cidadeSaida || x.cidade;
  if (!de || !x.cidadeDestino) return x.sentido ? `<div class="trajeto"><span>Carona de ${esc(x.sentido.toLowerCase())}</span></div>` : '';
  const cid = c => { const [n, uf] = nomeCid(c); return `<span>${esc(n)}${uf ? ` <small>${esc(uf)}</small>` : ''}</span>`; };
  return `<div class="trajeto">${cid(de)}<b aria-label="para">→</b>${cid(x.cidadeDestino)}</div>`;
}
const ordem = (a, b) => (a.data + trajeto(a) + (a.horario || '99:99')).localeCompare(b.data + trajeto(b) + (b.horario || '99:99'));
function filtra(lista) {
  return lista.filter(x => S.data === 'Todas' || x.data === S.data).sort(ordem);
}
function agrupa(lista, fnCard) {
  let html = '', chave = '';
  lista.forEach(x => {
    if (x.data !== chave) { chave = x.data; html += `<h2 class="grupo">${esc(dia(x.data, true))}</h2>`; }
    html += fnCard(x);
  });
  return html;
}
function datasConfig() {
  return String((S.d && S.d.config.datas) || '').split(/[,;\s]+/).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)).sort();
}

/* ======================================================== telas */
function render() {
  if (!S.d) return;
  if (S.d.semSessao) {
    fecharModal();
    if (S.token) salvarToken(null);
    S.eu = null;
    if (!S.naEntrada) renderEntrada();
    return;
  }
  S.naEntrada = false;
  S.eu = S.d.eu;
  const scroll = window.scrollY;
  const c = S.d.config;
  const nPed = S.d.pedidos.length;
  const nCar = S.d.caronas.length;

  $('#app').innerHTML = `
  <div class="wrap">
    ${S.novaVersao ? `<a class="nova-versao" href="${esc(S.novaVersao)}" target="_top">🔄 O app foi atualizado. Toque aqui para carregar a versão nova.</a>` : ''}
    <header>
      <div class="t">
        <h1>${esc(c.titulo || 'Caronas')}</h1>
        ${c.descricao ? `<p>${esc(c.descricao)}</p>` : ''}
      </div>
      <div class="topo-dir">
        <button class="sino${naoLidos() ? ' tem' : ''}" data-a="avisos" aria-label="Avisos">🔔${naoLidos() ? `<span class="badge">${naoLidos()}</span>` : ''}</button>
        <button class="eu" data-a="perfil" title="Meu perfil" aria-label="Meu perfil">${avatar(S.eu)}</button>
      </div>
    </header>
    ${naoLidos() ? `<button class="faixa-avisos" data-a="avisos">🔔 Você tem ${naoLidos()} ${naoLidos() > 1 ? 'avisos novos' : 'aviso novo'}. Toque para ver.</button>` : ''}
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="caronas" aria-selected="${S.aba === 'caronas'}">Caronas <span class="n">${nCar}</span></button>
      <button role="tab" data-aba="pedidos" aria-selected="${S.aba === 'pedidos'}">Pedidos <span class="n">${nPed}</span></button>
      <button role="tab" data-aba="minhas" aria-selected="${S.aba === 'minhas'}">Minhas caronas${meusPendentes() ? ` <span class="n alerta">${meusPendentes()}</span>` : ''}</button>
    </nav>
    ${S.aba !== 'minhas' ? filtrosHtml() : ''}
    <main>${S.aba === 'caronas' ? telaCaronas() : S.aba === 'pedidos' ? telaPedidos() : telaMinhas()}</main>
  </div>
  <div class="barra"><div class="in">
    <button class="btn pri" data-a="oferecer">${ICON.mais} Oferecer carona</button>
    <button class="btn" data-a="pedir">${ICON.mao} Pedir carona</button>
  </div></div>`;
  window.scrollTo(0, scroll);
}

function filtrosHtml() {
  const lista = S.aba === 'caronas' ? S.d.caronas : S.d.pedidos;
  const datas = [...new Set(lista.map(x => x.data).concat(datasConfig()))].sort();
  if (S.data !== 'Todas' && datas.indexOf(S.data) < 0) S.data = 'Todas';
  return `${datas.length > 1 ? `<div class="filtros">
    ${['Todas'].concat(datas).map(d => `<button class="chip" data-dia="${d}" aria-pressed="${S.data === d}">${d === 'Todas' ? 'Todos os dias' : esc(dia(d))}</button>`).join('')}
  </div>` : ''}`;
}

function telaCaronas() {
  const lista = filtra(S.d.caronas);
  if (!lista.length) return vazio('Nenhuma carona oferecida ainda', 'Tem carro? Toque em “Oferecer carona” para abrir vagas.');
  return agrupa(lista, cardCarona);
}

function cardCarona(c, opts) {
  opts = opts || {};
  const m = pessoa(c.motoristaId);
  const res = reservasDe(c.id);
  const souMotorista = c.motoristaId === S.eu.id;
  const pend = pendentesDe(c.id);
  const souPassageiro = res.some(r => r.pessoaId === S.eu.id);
  const souPendente = pend.some(r => r.pessoaId === S.eu.id);
  const livres = Math.max(0, c.vagas - res.length);
  const bolinhas = Array.from({ length: c.vagas }, (_, i) => `<i class="${i < res.length ? 'ocup' : ''}"></i>`).join('');
  const passageiros = res.map(r => {
    const p = pessoa(r.pessoaId);
    const x = souMotorista ? `<button data-a="remover" data-c="${c.id}" data-p="${p.id}" title="Remover ${esc(p.nome)}" aria-label="Remover ${esc(p.nome)}">×</button>` : '';
    return `<span class="pass"><span class="link-perfil" data-perfil="${esc(p.id)}">${avatar(p, 'p')}${esc(p.nome)}</span>${x}</span>`;
  }).join('');
  const pedidosVaga = souMotorista && pend.length ? `<div class="pendentes"><b>Pedidos de vaga (${pend.length})</b>
    ${pend.map(r => {
      const p = pessoa(r.pessoaId);
      return `<div class="pend"><span class="link-perfil" data-perfil="${esc(p.id)}">${avatar(p, 'p')}<span>${esc(p.nome)}</span></span>
        <button class="btn pri" data-a="aprovar" data-c="${c.id}" data-p="${p.id}" ${livres ? '' : 'disabled'}>Aprovar</button>
        <button class="btn perigo" data-a="recusar" data-c="${c.id}" data-p="${p.id}">Recusar</button></div>`;
    }).join('')}
    ${livres ? '' : '<small>Carona lotada: remova alguém ou aumente as vagas para aprovar.</small>'}</div>` : '';

  let acoes = '';
  if (souMotorista) {
    acoes = `<button class="btn" data-a="editar" data-c="${c.id}">Editar</button>
             <button class="btn perigo" data-a="cancelar" data-c="${c.id}">Cancelar carona</button>`;
  } else {
    acoes = souPassageiro
      ? `<button class="btn perigo" data-a="sair" data-c="${c.id}">Sair da carona</button>`
      : souPendente
        ? `<button class="btn perigo" data-a="desistir" data-c="${c.id}">Cancelar pedido de vaga</button>`
        : (livres > 0 ? `<button class="btn pri" data-a="entrar" data-c="${c.id}">Pedir vaga</button>` : '');
    acoes += btnWa(m, souPendente
      ? `Oi, ${primeiro(m.nome)}! Pedi uma vaga na sua carona ${trajetoTxt(c)} (${dia(c.data)}) no app de caronas.`
      : `Oi, ${primeiro(m.nome)}! Vi sua carona ${trajetoTxt(c)} (${dia(c.data)}) no app de caronas.`);
  }
  acoes += btnRota(endereco(c.saida, c.cidadeSaida), endereco(c.destino, c.cidadeDestino));

  return `<article class="card ${souMotorista || souPassageiro ? 'minha' : ''}" id="carona-${esc(c.id)}">
    ${trajetoHtml(c)}
    <div class="topo">
      ${quemLink(m)}
      <div class="quem link-perfil" data-perfil="${esc(m.id)}"><strong>${esc(m.nome)}${souMotorista ? ' (você)' : ''}</strong>
        <span>${opts.comDia ? esc(dia(c.data)) + ' · ' : ''}motorista · ver perfil</span></div>
    </div>
    ${souPendente ? '<p class="aguardando">⏳ Você pediu vaga. Aguardando o motorista aprovar.</p>' : ''}
    <div class="rota">
      <span class="h">${esc(c.horario || '--:--')}</span><span class="l"><small>Saída</small>${esc(c.saida)}</span>
      <span class="seta">↓</span><span class="l"><small>Destino</small>${esc(c.destino)}</span>
    </div>
    <div class="assentos">${bolinhas}<b class="${livres ? '' : 'lotado'}">${livres ? livres + (livres > 1 ? ' vagas livres' : ' vaga livre') : 'Lotado'}</b></div>
    ${passageiros ? `<div class="passageiros">${passageiros}</div>` : ''}
    ${pedidosVaga}
    ${c.obs ? `<p class="obs">${esc(c.obs)}</p>` : ''}
    ${acoes.trim() ? `<div class="acoes">${acoes}</div>` : ''}
  </article>`;
}

function telaPedidos() {
  const lista = filtra(S.d.pedidos);
  if (!lista.length) return vazio('Ninguém pedindo carona por aqui', 'Precisa ir? Toque em “Pedir carona” para avisar os motoristas.');
  return agrupa(lista, cardPedido);
}

function cardPedido(p, opts) {
  opts = opts || {};
  const quem = pessoa(p.pessoaId);
  const meu = p.pessoaId === S.eu.id;
  const minhasComVaga = S.d.caronas.filter(c => c.motoristaId === S.eu.id && mesmaViagem(c, p) && reservasDe(c.id).length < c.vagas);
  let acoes = '';
  if (meu) acoes = `<button class="btn perigo" data-a="cancelarPedido" data-p="${p.id}">Cancelar pedido</button>`;
  else {
    if (minhasComVaga.length) acoes += `<button class="btn pri" data-a="levar" data-p="${p.id}">Levar na minha carona</button>`;
    acoes += btnWa(quem, `Oi, ${primeiro(quem.nome)}! Vi que você precisa de carona ${trajetoTxt(p)} (${dia(p.data)}, ${faixa(p).toLowerCase()}).`);
  }
  acoes += btnMapa(endereco(p.local, p.cidade));
  return `<article class="card ${meu ? 'minha' : ''}">
    ${trajetoHtml(p)}
    <div class="topo">
      ${quemLink(quem)}
      <div class="quem link-perfil" data-perfil="${esc(quem.id)}"><strong>${esc(quem.nome)}${meu ? ' (você)' : ''}</strong>
        <span>${opts.comDia ? esc(dia(p.data)) + ' · ' : ''}precisa de carona · ver perfil</span></div>
    </div>
    <div class="rota">
      <span class="h">🕒</span><span class="l"><small>Horário</small>${esc(faixa(p))}</span>
      <span class="h">📍</span><span class="l"><small>Região de saída</small>${esc(p.local)}</span>
    </div>
    ${p.obs ? `<p class="obs">${esc(p.obs)}</p>` : ''}
    ${meu && jaTenhoCarona(p) && pedidoAberto(p.id) ? perguntaPedidoHtml(p.id, '✅ Você já tem carona nesse dia e trajeto. Quer excluir este pedido?') : ''}
    ${acoes ? `<div class="acoes">${acoes}</div>` : ''}
  </article>`;
}
/* estou numa carona (aprovado ou dirigindo) no mesmo dia e trajeto deste pedido? */
const jaTenhoCarona = p => S.d.caronas.some(c => mesmaViagem(c, p) &&
  (c.motoristaId === S.eu.id || reservasDe(c.id).some(r => r.pessoaId === S.eu.id)));

function telaMinhas() {
  const dirijo = S.d.caronas.filter(c => c.motoristaId === S.eu.id).sort(ordem);
  const vou = S.d.caronas.filter(c => reservasDe(c.id).some(r => r.pessoaId === S.eu.id)).sort(ordem);
  const espero = S.d.caronas.filter(c => pendentesDe(c.id).some(r => r.pessoaId === S.eu.id)).sort(ordem);
  const peco = S.d.pedidos.filter(p => p.pessoaId === S.eu.id).sort(ordem);
  if (!dirijo.length && !vou.length && !espero.length && !peco.length) {
    return vazio('Você ainda não está em nenhuma carona', 'Ofereça uma carona, entre na aba “Caronas” ou faça um pedido.');
  }
  let h = '';
  if (dirijo.length) h += `<h3 class="sec">Você dirige</h3>` + dirijo.map(c => cardCarona(c, { comDia: true })).join('');
  if (vou.length) h += `<h3 class="sec">Você vai de carona</h3>` + vou.map(c => cardCarona(c, { comDia: true })).join('');
  if (espero.length) h += `<h3 class="sec">Aguardando aprovação do motorista</h3>` + espero.map(c => cardCarona(c, { comDia: true })).join('');
  if (peco.length) h += `<h3 class="sec">Seus pedidos em aberto</h3>` + peco.map(p => cardPedido(p, { comDia: true })).join('');
  return h;
}

function vazio(t, s) { return `<div class="vazio"><strong>${esc(t)}</strong>${esc(s)}</div>`; }

/* ============================================= entrada (login) */
let fotoTemp = '';
const AVISO_SENHA = `<p class="alerta">Crie uma senha <b>só para este app</b>. Não use a mesma senha do seu e-mail, banco, gov.br ou redes sociais.</p>`;

function telaEntrada(titulo, sub, corpo) {
  S.naEntrada = true;
  $('#app').innerHTML = `<div class="wrap"><div class="entrada"><div class="card">
    <h1>${esc(titulo)}</h1><p class="sub">${esc(sub)}</p>${corpo}</div></div></div>`;
  const v = $('#voltar');
  if (v) v.onclick = () => renderEntrada();
}

function aoEntrar(r, msg) {
  if (!r || !r.token) return;
  salvarToken(r.token);
  S.naEntrada = false;
  render();
  if (S.eu) toast(msg + ', ' + primeiro(S.eu.nome) + '!');
}

function confere(f) {
  if (f.senha.value !== f.senha2.value) { toast('As duas senhas não são iguais.', true); f.senha2.focus(); return false; }
  return true;
}

  <label class="f"><span>Repita a senha</span>
    <input class="in-txt" name="senha2" type="password" autocomplete="new-password" minlength="6" required></label>
  ${AVISO_SENHA}`;
const botaoVoltar = `<button class="btn cheio" type="button" id="voltar" style="margin-top:8px;border:0">Voltar</button>`;

async function pedirCodigo(tel, botao) {
  const r = await acao('esqueci', { telefone: tel }, null, botao);
  if (r && r.email) { renderEntrada('codigo', tel, r.email); toast('Código enviado!'); }
}

function ligaFoto(inputSel, prevSel, pessoaFn) {
  $(inputSel).onchange = async ev => {
    const arq = ev.target.files[0];
    if (!arq) return;
    try {
      fotoTemp = await reduzirFoto(arq);
      $(prevSel).innerHTML = `<img class="av g" src="${fotoTemp}" alt="">`;
    } catch (e) { toast('Não consegui ler essa imagem.', true); }
  };
}

function reduzirFoto(arq) {
  return new Promise((ok, falha) => {
    const img = new Image();
    const url = URL.createObjectURL(arq);
    img.onload = () => {
      const lado = 160, cv = document.createElement('canvas');
      cv.width = cv.height = lado;
      const s = Math.min(img.width, img.height);
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, lado, lado);
      URL.revokeObjectURL(url);
      let q = 0.8, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 40000 && q > 0.3) { q -= 0.15; d = cv.toDataURL('image/jpeg', q); }
      ok(d);
    };
    img.onerror = falha;
    img.src = url;
  });
}

/* ============================================================ modais */
const modalAberto = () => !$('#modal').hidden;
let rolagemAntes = 0;
function fecharModal() {
  if (!modalAberto()) return;
  $('#modal').hidden = true;
  document.body.classList.remove('com-janela');
  window.scrollTo(0, rolagemAntes);
}
function modal(titulo, corpo, aoEnviar, rotulo) {
  const f = $('#mform');
  f.innerHTML = `<h2>${esc(titulo)}<button class="x" type="button" data-a="fechar">← Voltar</button></h2>${corpo}
    ${aoEnviar ? `<button class="btn pri cheio" type="submit" value="ok" id="mok">${esc(rotulo || 'Salvar')}</button>` : ''}`;
  f.onsubmit = async ev => {
    ev.preventDefault();
    if (!aoEnviar) return;
    const ok = await aoEnviar(f, ev.submitter || $('#mok'));
    if (ok) fecharModal();
  };
  f.querySelectorAll('[data-cal]').forEach(desenhaCal);
  if (f.querySelector('[data-cid-in]')) carregaCidades();
  if (!modalAberto()) rolagemAntes = window.scrollY;
  $('#modal').hidden = false;
  document.body.classList.add('com-janela');
  window.scrollTo(0, 0);
}

/* dia e horário são listas simples: o calendário e o relógio do celular não abrem dentro do Google */
const dois = n => String(n).padStart(2, '0');
function proximosDias(n) {
  const hoje = new Date(), lista = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
    lista.push(d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate()));
  }
  return lista;
}
/* calendário desenhado pelo app: no Chrome do Android, dentro da moldura do Google, o calendário nativo não abre */
function campoData(nome, valor) {
  const config = datasConfig();
  if (!config.length) {
    const mes = (valor || proximosDias(1)[0]).slice(0, 7);
    return `<div class="cal" data-cal data-mes="${mes}">
      <input type="hidden" name="${nome}" value="${esc(valor || '')}">
      <button type="button" class="in-txt cal-abre" data-cal-abre></button>
      <div class="cal-janela" hidden>
        <div class="cal-topo"><button type="button" data-cal-mes="-1" aria-label="Mês anterior">‹</button>
          <strong></strong><button type="button" data-cal-mes="1" aria-label="Próximo mês">›</button></div>
        <div class="cal-grade"></div></div></div>`;
  }
  const ds = config.slice();
  if (valor && ds.indexOf(valor) < 0) ds.unshift(valor);
  return `<div class="dias">${ds.map(d => {
    const [semana, data] = dia(d).split(', ');
    return `<label><input type="radio" name="${nome}" value="${d}" ${valor === d ? 'checked' : ''}><span>${esc(semana)}<small>${esc(data)}</small></span></label>`;
  }).join('')}</div>`;
}
function desenhaCal(el) {
  const [a, m] = el.dataset.mes.split('-').map(Number);
  const valor = el.querySelector('input').value;
  const hoje = proximosDias(1)[0];
  const inicio = new Date(a, m - 1, 1);
  const titulo = inicio.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  el.querySelector('.cal-topo strong').textContent = titulo.charAt(0).toUpperCase() + titulo.slice(1);
  let h = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<span class="cal-sem">${x}</span>`).join('');
  h += '<span></span>'.repeat(inicio.getDay());
  for (let d = 1; d <= new Date(a, m, 0).getDate(); d++) {
    const iso = a + '-' + dois(m) + '-' + dois(d);
    const cls = (iso === valor ? ' sel' : '') + (iso === hoje ? ' hoje' : '');
    h += `<button type="button" class="cal-dia${cls}" data-cal-dia="${iso}" ${iso < hoje && iso !== valor ? 'disabled' : ''}>${d}</button>`;
  }
  el.querySelector('.cal-grade').innerHTML = h;
  const abre = el.querySelector('.cal-abre');
  abre.textContent = '📅 ' + (valor ? dia(valor, true) : 'Escolha o dia');
  abre.classList.toggle('vazio', !valor);
}
function cliqueCal(ev) {
  const abre = ev.target.closest('[data-cal-abre]');
  const mes = ev.target.closest('[data-cal-mes]');
  const escolha = ev.target.closest('[data-cal-dia]');
  const alvo = abre || mes || escolha;
  const el = alvo && alvo.closest('[data-cal]');
  if (!el) return false;
  const janela = el.querySelector('.cal-janela');
  if (abre) {
    janela.hidden = !janela.hidden;
    return true;
  }
  if (mes) {
    let [a, m] = el.dataset.mes.split('-').map(Number);
    m += Number(mes.dataset.calMes);
    if (m < 1) { m = 12; a--; }
    if (m > 12) { m = 1; a++; }
    el.dataset.mes = a + '-' + dois(m);
  } else {
    el.querySelector('input').value = escolha.dataset.calDia;
    janela.hidden = true;
  }
  desenhaCal(el);
  return true;
}

/* cidade: digita e escolhe nas sugestões (lista do IBGE vem do servidor uma vez só) */
let CIDADES = null, cidadesPromessa = null;
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function carregaCidades() {
  if (!cidadesPromessa) {
    cidadesPromessa = chamar('cidades')
      .then(t => { CIDADES = t.split(';').map(n => [n, semAcento(n)]); return true; })
      .catch(() => { cidadesPromessa = null; return false; });
  }
  return cidadesPromessa;
}
function campoCidade(nome, valor, rotulo) {
  return `<div class="f cid"><span>${esc(rotulo)}</span>
    <input class="in-txt" name="${nome}" value="${esc(valor || '')}" data-cid-in autocomplete="off" maxlength="80"
      placeholder="Digite e escolha na lista" required>
    <div class="cid-lista" hidden></div></div>`;
}
function sugereCidades(el) {
  const lista = el.parentNode.querySelector('.cid-lista');
  const q = semAcento(el.value.trim());
  if (q.length < 2) { lista.hidden = true; return; }
  if (!CIDADES) {
    lista.innerHTML = '<p class="cid-msg">Carregando cidades…</p>';
    lista.hidden = false;
    carregaCidades().then(ok => {
      if (ok) sugereCidades(el);
      else lista.innerHTML = '<p class="cid-msg">Não consegui carregar as cidades. Tente de novo.</p>';
    });
    return;
  }
  const comeca = [], contem = [];
  for (const [n, s] of CIDADES) {
    if (s.startsWith(q)) comeca.push(n);
    else if (contem.length < 8 && s.includes(q)) contem.push(n);
    if (comeca.length >= 8) break;
  }
  const achou = comeca.concat(contem).slice(0, 8);
  lista.innerHTML = achou.length
    ? achou.map(n => `<button type="button" data-cid-op="${esc(n)}">${esc(n)}</button>`).join('')
    : '<p class="cid-msg">Nenhuma cidade encontrada.</p>';
  lista.hidden = false;
}
function cliqueCidade(ev) {
  const op = ev.target.closest('[data-cid-op]');
  if (!op) return false;
  const caixa = op.closest('.cid');
  caixa.querySelector('input').value = op.dataset.cidOp;
  caixa.querySelector('.cid-lista').hidden = true;
  return true;
}
/* aceita o nome digitado sem escolher na lista (ex.: uberaba), se só existir uma cidade com esse nome */
function corrigeCidades(f) {
  if (!CIDADES) return;
  f.querySelectorAll('[data-cid-in]').forEach(el => {
    if (CIDADES.some(([n]) => n === el.value)) return;
    const q = semAcento(el.value.trim());
    const iguais = CIDADES.filter(([, s]) => s.slice(0, s.lastIndexOf(' (')) === q);
    if (iguais.length === 1) el.value = iguais[0][0];
  });
}
function fechaFlutuantes(alvo) {
  document.querySelectorAll('.cal-janela:not([hidden]), .cid-lista:not([hidden])').forEach(j => {
    if (!j.parentNode.contains(alvo)) j.hidden = true;
  });
}
function campoHora(nome, valor, exemplo) {
  return `<input class="in-txt" name="${nome}" data-hora inputmode="numeric" autocomplete="off" maxlength="5" placeholder="${esc(exemplo || 'Ex.: 07:30')}" value="${esc(valor || '')}">`;
}
/* faixa de horário do pedido: entre 07:00 e 09:00, a partir de 07:00 ou até 09:00 */
function faixa(p) {
  if (p.horario && p.horarioFim) return `Entre ${p.horario} e ${p.horarioFim}`;
  if (p.horario) return 'A partir de ' + p.horario;
  if (p.horarioFim) return 'Até ' + p.horarioFim;
  return 'Qualquer horário';
}
function mascaraHora(el) {
  const n = el.value.replace(/\D/g, '').slice(0, 4);
  el.value = n.length > 2 ? n.slice(0, 2) + ':' + n.slice(2) : n;
}

function abrirLevar(pid) {
  const p = S.d.pedidos.find(x => x.id === pid);
  if (!p) return;
  const quem = pessoa(p.pessoaId);
  const minhas = S.d.caronas.filter(c => c.motoristaId === S.eu.id && mesmaViagem(c, p) && reservasDe(c.id).length < c.vagas);
  modal(`Levar ${primeiro(quem.nome)}`,
    `<p style="margin-top:0;color:var(--muted)">Escolha em qual carona sua ${esc(primeiro(quem.nome))} vai. Avise a pessoa pelo WhatsApp depois.</p>` +
    minhas.map(c => `<button class="btn opcao" value="c" data-c="${c.id}">${esc(c.horario || '--:--')} · ${esc(c.saida)} → ${esc(c.destino)} · ${c.vagas - reservasDe(c.id).length} vaga(s)</button>`).join(''));
  $('#mform').querySelectorAll('.opcao').forEach(b => b.onclick = async ev => {
    ev.preventDefault();
    const ok = await acao('levar', { token: S.token, pedidoId: pid, caronaId: b.dataset.c }, primeiro(quem.nome) + ' foi adicionado(a) à sua carona.', b);
    if (ok) fecharModal();
  });
}

    <label class="f"><span>Nome</span><input class="in-txt" name="nome" maxlength="60" value="${esc(S.eu.nome)}" required></label>
    ${campoSobre(S.eu.descricao)}
    <label class="f"><span>WhatsApp</span><input class="in-txt" value="${esc(S.eu.telefone)}" disabled></label>
    <label class="opcao-check"><input type="checkbox" name="avisosEmail" ${S.eu.avisosEmail !== false ? 'checked' : ''}>
      <span>Receber avisos por e-mail <small>(pedidos de vaga, aprovações, cancelamentos e caronas novas para o seu pedido)</small></span></label>
    <label class="f"><span>E-mail <small>(só você vê; usado para recuperar a senha)</small></span>
      <input class="in-txt" name="email" type="email" autocomplete="email" maxlength="120" value="${esc(S.eu.email || '')}" required></label>
    <div class="lado" style="margin-bottom:10px">
      <button class="btn" type="button" id="trocaSenha" style="justify-content:center">Trocar senha</button>
      <button class="btn" type="button" id="sairApp" style="justify-content:center">Sair deste aparelho</button>
    </div>`,
    async (f, b) => {
      const nova = fotoTemp;
      const ok = await acao('perfil', { token: S.token, nome: f.nome.value, descricao: f.descricao.value, email: f.email.value,
        avisosEmail: f.avisosEmail.checked, foto: nova, removerFoto: remover && !nova }, 'Perfil salvo.', b);
      if (ok && nova) { guardaMinhaFoto(nova); render(); }
      return ok;
    });
  ligaFoto('#arqPerfil', '#prevPerfil');
  const tf = $('#tiraFoto');
  if (tf) tf.onclick = () => { remover = true; fotoTemp = ''; $('#prevPerfil').innerHTML = avatar({ id: S.eu.id, nome: S.eu.nome }, 'g'); };
  $('#sairApp').onclick = async () => {
    fecharModal();
    try { await chamar('api', 'sair', { token: S.token }); } catch (e) {}
    salvarToken(null); S.eu = null;
    S.d = { config: S.d.config, semSessao: true }; S.naEntrada = false;
    render();
  };
  $('#trocaSenha').onclick = abrirTrocarSenha;
}

/* lista de avisos; ao abrir, marca como lidos */
function quando(iso) {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!(min >= 0)) return '';
  if (min < 1) return 'agora';
  if (min < 60) return 'há ' + min + ' min';
  if (min < 24 * 60) return 'há ' + Math.round(min / 60) + ' h';
  return dia(new Date(iso).toISOString().slice(0, 10));
}
const MANTER = 'caronas_manter';
const mantidos = () => { try { return JSON.parse(localStorage.getItem(MANTER) || '[]'); } catch (e) { return []; } };
function manterPedido(id) {
  const l = mantidos();
  if (l.indexOf(id) < 0) l.push(id);
  try { localStorage.setItem(MANTER, JSON.stringify(l.slice(-100))); } catch (e) {}
}
/* pedido meu que ainda existe e sobre o qual ainda não respondi se quero manter */
const pedidoAberto = id => id && mantidos().indexOf(id) < 0 && S.d.pedidos.some(p => p.id === id && p.pessoaId === S.eu.id);
function perguntaPedidoHtml(pid, texto) {
  return `<div class="pergunta-pedido">${esc(texto)}
    <div class="acoes"><button class="btn perigo" data-a="excluirPedido" data-p="${esc(pid)}">Excluir pedido</button>
    <button class="btn" data-a="manterPedido" data-p="${esc(pid)}">Manter pedido</button></div></div>`;
}

function abrirAvisos() {
  const lista = (S.d.avisos || []);
  const html = lista.length ? lista.map(a => {
    const temCarona = a.caronaId && S.d.caronas.some(c => c.id === a.caronaId);
    return `<div class="aviso-item${a.lida ? '' : ' novo'}">${esc(a.texto)}<time>${esc(quando(a.criadoEm))}</time>
      ${pedidoAberto(a.pedidoId) ? perguntaPedidoHtml(a.pedidoId, 'Quer excluir seu pedido de carona desse dia e trajeto?') : ''}
      ${temCarona ? `<div class="acoes"><button class="btn" data-a="verCarona" data-c="${esc(a.caronaId)}">Ver carona</button></div>` : ''}
    </div>`;
  }).join('') : '<p class="pergunta">Nenhum aviso por enquanto. Quando alguém pedir vaga na sua carona, aprovar a sua ou surgir uma carona para o seu pedido, aparece aqui.</p>';
  modal('Avisos', html);
  if (naoLidos()) {
    S.d.avisos.forEach(a => { a.lida = true; });
    checaAvisos();
    render();
    chamar('api', 'lerAvisos', { token: S.token }).catch(() => {});
  }
}
function verCarona(cid) {
  const c = S.d.caronas.find(x => x.id === cid);
  fecharModal();
  if (!c) return;
  const minha = c.motoristaId === S.eu.id || S.d.reservas.some(r => r.caronaId === cid && r.pessoaId === S.eu.id);
  S.aba = minha ? 'minhas' : 'caronas';
  S.data = 'Todas';
  render();
  const el = document.getElementById('carona-' + cid);
  if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('destaque'); setTimeout(() => el.classList.remove('destaque'), 2500); }
}
/* depois de oferecer carona: se eu tinha pedido para o mesmo dia e trajeto, pergunta se quero excluir */
function perguntaPedidoDepoisDeOferecer(cid) {
  const c = S.d.caronas.find(x => x.id === cid);
  const p = c && S.d.pedidos.find(x => x.pessoaId === S.eu.id && mesmaViagem(x, c));
  if (!p) return;
  modal('Seu pedido de carona', `<p class="pergunta">Você também tem um pedido de carona ${esc(trajetoTxt(p))} nesse dia (${esc(faixa(p).toLowerCase())}). Quer excluir o pedido?</p>
    <button class="btn cheio" type="button" data-a="manterPedido" data-p="${esc(p.id)}">Não, manter o pedido</button>`,
    (f, b) => acao('cancelarPedido', { token: S.token, pedidoId: p.id }, 'Pedido excluído.', b), 'Sim, excluir o pedido');
}

/* confirmação desenhada pelo app (a caixinha nativa do navegador também pode não abrir dentro do Google) */
function pergunta(titulo, texto, rotulo, executar) {
  modal(titulo, `<p class="pergunta">${esc(texto)}</p>`, (f, b) => executar(b), rotulo);
}

function fmtTel(t) {
  t = String(t || '').replace(/\D/g, '');
  if (t.length === 11) return `(${t.slice(0, 2)}) ${t.slice(2, 7)}-${t.slice(7)}`;
  if (t.length === 10) return `(${t.slice(0, 2)}) ${t.slice(2, 6)}-${t.slice(6)}`;
  return t;
}
function abrirPessoa(id) {
  const p = pessoa(id);
  const eu = p.id === S.eu.id;
  const semTexto = eu ? 'Você ainda não escreveu nada sobre você. Toque na sua foto, no alto da tela, para editar.'
                      : 'Esta pessoa ainda não escreveu nada sobre si.';
  modal(eu ? 'Seu perfil' : 'Perfil', `<div class="ver-perfil">
    ${avatar(p, 'g')}
    <h3>${esc(p.nome)}</h3>
    ${p.telefone ? `<p class="tel">📱 ${esc(fmtTel(p.telefone))}</p>` : ''}
    <p class="desc${p.descricao ? '' : ' vazio'}">${esc(p.descricao || semTexto)}</p>
    ${eu ? '' : `<div class="acoes">${btnWa(p, `Oi, ${primeiro(p.nome)}! Te encontrei no app de caronas.`)}</div>`}
  </div>`);
}

function abrirTrocarSenha() {
  modal('Trocar senha', `
    <label class="f"><span>Senha atual</span><input class="in-txt" name="atual" type="password" autocomplete="current-password" required></label>
    <label class="f"><span>Nova senha <small>(mínimo 6 caracteres)</small></span><input class="in-txt" name="senha" type="password" autocomplete="new-password" minlength="6" required></label>
    <label class="f"><span>Repita a nova senha</span><input class="in-txt" name="senha2" type="password" autocomplete="new-password" minlength="6" required></label>
    ${AVISO_SENHA}`,
    (f, b) => confere(f) && acao('trocarSenha', { token: S.token, atual: f.atual.value, nova: f.senha.value }, 'Senha alterada.', b), 'Salvar nova senha');
}

/* ============================================================ eventos */
document.addEventListener('click', async ev => {
  const aba = ev.target.closest('[data-aba]');
  if (aba) { S.aba = aba.dataset.aba; render(); window.scrollTo(0, 0); return; }
  fechaFlutuantes(ev.target);
  if (cliqueCal(ev) || cliqueCidade(ev)) return;
  const fdia = ev.target.closest('[data-dia]');
  if (fdia) { S.data = fdia.dataset.dia; render(); return; }
  const pf = ev.target.closest('[data-perfil]');
  if (pf) return abrirPessoa(pf.dataset.perfil);
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, cid = el.dataset.c, pid = el.dataset.p;
  if (a === 'fechar') return fecharModal();
  if (a === 'avisos') return abrirAvisos();
  if (a === 'verCarona') return verCarona(cid);
  if (a === 'manterPedido') {
    manterPedido(pid);
    toast('Pedido mantido.');
    if ($('#mform .aviso-item')) abrirAvisos(); else if (modalAberto()) fecharModal();
    return render();
  }
  if (a === 'excluirPedido') {
    const ok = await acao('cancelarPedido', { token: S.token, pedidoId: pid }, 'Pedido excluído.', el);
    if (ok && $('#mform .aviso-item')) abrirAvisos();
    return;
  }
  if (a === 'oferecer') return abrirOferecer();
  if (a === 'pedir') return abrirPedir();
  if (a === 'perfil') return abrirPerfil();
  if (a === 'editar') return abrirEditar(cid);
  if (a === 'levar') return abrirLevar(pid);
  const t = S.token;
  if (a === 'entrar') return acao('entrarCarona', { token: t, caronaId: cid }, 'Pedido de vaga enviado! Avise o motorista pelo WhatsApp.', el);
  if (a === 'aprovar') return acao('aprovar', { token: t, caronaId: cid, passageiroId: pid }, primeiro(pessoa(pid).nome) + ' agora está na sua carona.', el);
  if (a === 'sair') return pergunta('Sair da carona', 'Sua vaga fica livre para outra pessoa.', 'Sair da carona',
    b => acao('sairCarona', { token: t, caronaId: cid }, 'Você saiu da carona.', b));
  if (a === 'desistir') return pergunta('Cancelar pedido de vaga', 'O motorista não vai mais ver o seu pedido.', 'Cancelar pedido',
    b => acao('sairCarona', { token: t, caronaId: cid }, 'Pedido de vaga cancelado.', b));
  if (a === 'recusar') return pergunta('Recusar pedido de vaga', `${pessoa(pid).nome} não vai entrar nesta carona.`, 'Recusar',
    b => acao('removerPassageiro', { token: t, caronaId: cid, passageiroId: pid }, 'Pedido recusado.', b));
  if (a === 'remover') return pergunta('Remover passageiro', `Remover ${pessoa(pid).nome} da carona?`, 'Remover',
    b => acao('removerPassageiro', { token: t, caronaId: cid, passageiroId: pid }, 'Passageiro removido.', b));
  if (a === 'cancelar') {
    const n = reservasDe(cid).length;
    return pergunta('Cancelar carona', n ? `${n} passageiro(s) vão perder o lugar. Avise-os pelo WhatsApp.` : 'A carona vai sair da lista.', 'Cancelar carona',
      b => acao('cancelarCarona', { token: t, caronaId: cid }, 'Carona cancelada.', b));
  }
  if (a === 'cancelarPedido') return pergunta('Cancelar pedido de carona', 'Seu pedido vai sair da aba “Pedidos”.', 'Cancelar pedido',
    b => acao('cancelarPedido', { token: t, pedidoId: pid }, 'Pedido cancelado.', b));
});
document.addEventListener('input', ev => {
  if (ev.target.matches('[data-hora]')) mascaraHora(ev.target);
  if (ev.target.matches('[data-cid-in]')) sugereCidades(ev.target);
});

/* atualiza sozinho a cada 30 s enquanto a página está aberta */
setInterval(() => {
  if (document.hidden || S.ocupado || modalAberto() || !S.eu) return;
  atualizar();
}, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.eu && !modalAberto()) atualizar(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && modalAberto()) fecharModal(); });

S.token = lerToken();
atualizar();
})();
</script>
</body>
</html>
